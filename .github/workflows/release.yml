name: Build Windows release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.1.4'
        required: true
        default: v0.1.4

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected an existing vMAJOR.MINOR.PATCH tag' >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
      - name: Build locked Windows executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package app, licenses and checksums (no driver)
        shell: pwsh
        run: ./packaging/build-portable.ps1 -AppPath ./target/x86_64-pc-windows-msvc/release/kynn-voice.exe -OutputDirectory ./target/public-release
      - uses: actions/upload-artifact@v5
        with:
          name: kynn-voice-windows-x64
          path: |
            target/public-release/*.exe
            target/public-release/*.zip
            target/public-release/SHA256SUMS.txt
            target/public-release/LICENSE
            target/public-release/THIRD_PARTY_NOTICES.md
            target/public-release/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
  draft:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v5
        with:
          name: kynn-voice-windows-x64
          path: release-assets
      - name: Create draft for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
            --title "Kynn Voice $RELEASE_TAG · Windows x64" \
            --notes-file RELEASE_NOTES.md release-assets/*
