name: Build Windows release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.1.5'
        required: true
        default: v0.1.5

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected an existing vMAJOR.MINOR.PATCH tag' >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Verify tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $manifest = Get-Content -LiteralPath Cargo.toml -Raw
          $match = [regex]::Match($manifest, '(?ms)^\[package\].*?^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $match.Success) { throw 'Could not read package version from Cargo.toml.' }
          $version = $match.Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match package version $version."
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
      - name: Build locked Windows executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Download and verify official VB-CABLE payload
        shell: pwsh
        env:
          DRIVER_URL: https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip
          DRIVER_SHA256: b950e39f01af1d04ea623c8f6d8eb9b6ea5c477c637295fabf20631c85116bfb
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'VBCABLE_Driver_Pack45.zip'
          Invoke-WebRequest -Uri $env:DRIVER_URL -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:DRIVER_SHA256) {
            throw "VB-CABLE archive SHA-256 mismatch. Expected $env:DRIVER_SHA256; got $actual."
          }
          "DRIVER_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Package app, licenses and checksums (no driver)
        shell: pwsh
        run: ./packaging/build-portable.ps1 -AppPath ./target/x86_64-pc-windows-msvc/release/kynn-voice.exe -OutputDirectory "./target/public-release-$env:RELEASE_VERSION"
      - name: Build Setup with optional VB-CABLE installation
        shell: pwsh
        run: ./packaging/build-installer.ps1 -DriverArchivePath $env:DRIVER_ARCHIVE -AppPath ./target/x86_64-pc-windows-msvc/release/kynn-voice.exe -SkipCargoBuild
      - name: Collect release assets at one artifact root
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE 'target\release-assets'
          $workspacePrefix = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
          $resolvedStaging = [System.IO.Path]::GetFullPath($staging)
          if (-not $resolvedStaging.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to stage assets outside the workspace: $resolvedStaging"
          }
          if (Test-Path -LiteralPath $resolvedStaging) {
            Remove-Item -LiteralPath $resolvedStaging -Recurse -Force
          }
          New-Item -ItemType Directory -Path $resolvedStaging | Out-Null
          $portable = Join-Path $env:GITHUB_WORKSPACE ('target\public-release-' + $env:RELEASE_VERSION)
          $setup = Join-Path $env:GITHUB_WORKSPACE ('target\release\KynnVoice-Setup-' + $env:RELEASE_VERSION + '-x64.exe')
          $sources = @(
            (Join-Path $portable ('KynnVoice-' + $env:RELEASE_VERSION + '-windows-x64.exe')),
            (Join-Path $portable ('KynnVoice-' + $env:RELEASE_VERSION + '-windows-x64-portable.zip')),
            (Join-Path $portable 'SHA256SUMS.txt'),
            (Join-Path $portable 'LICENSE'),
            (Join-Path $portable 'THIRD_PARTY_NOTICES.md'),
            (Join-Path $portable 'THIRD_PARTY_LICENSES.txt'),
            $setup,
            ($setup + '.sha256')
          )
          foreach ($source in $sources) {
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Expected release asset was not produced: $source"
            }
            Copy-Item -LiteralPath $source -Destination $resolvedStaging
          }
      - uses: actions/upload-artifact@v5
        with:
          name: kynn-voice-windows-x64
          path: target/release-assets/*
          if-no-files-found: error
  draft:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v5
        with:
          name: kynn-voice-windows-x64
          path: release-assets
      - name: Create draft for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
            --title "Kynn Voice $VERSION · Windows x64" \
            --notes-file RELEASE_NOTES.md release-assets/*
