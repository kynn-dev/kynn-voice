name: Windows CI

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        features: [default, rnnoise-only]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.features }}
      - name: Formatting
        run: cargo fmt --all --check
      - name: Check all targets
        shell: pwsh
        env:
          FEATURE_SET: ${{ matrix.features }}
        run: |
          $features = if ($env:FEATURE_SET -eq 'rnnoise-only') { @('--no-default-features') } else { @() }
          cargo check --all-targets --locked @features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unit tests (no devices or startup registration)
        shell: pwsh
        env:
          FEATURE_SET: ${{ matrix.features }}
        run: |
          $features = if ($env:FEATURE_SET -eq 'rnnoise-only') { @('--no-default-features') } else { @() }
          cargo test --locked @features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
